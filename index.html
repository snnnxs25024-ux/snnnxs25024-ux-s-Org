    <style>
      /* Custom Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; /* gray-100 */
      }
      ::-webkit-scrollbar-thumb {
        background: #3b82f6; /* blue-500 */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2563eb; /* blue-600 */
      }

      /* Print Styling for Thermal Printer - FIXED */
      @media print {
        @page {
          margin: 0;
          size: auto;
        }
        
        body {
          background-color: white;
          margin: 0;
          padding: 0;
        }

        /* Sembunyikan semua elemen di body */
        body * {
          visibility: hidden;
        }

        /* Tampilkan HANYA container QR dan anak-anaknya */
        #printable-qr, #printable-qr * {
          visibility: visible;
        }

        /* Posisikan container QR di paling atas menutupi yang lain */
        #printable-qr {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 10px 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
          background-color: white;
          z-index: 9999;
        }

        /* Pastikan elemen dengan class no-print benar-benar hilang layoutnya */
        .no-print {
          display: none !important;
        }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {

    </script>
