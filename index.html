    <meta charset="UTF-8" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
    <title>ABSENSI NEXUS SUNTER DC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Custom Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; /* gray-100 */
      }
      ::-webkit-scrollbar-thumb {
        background: #3b82f6; /* blue-500 */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2563eb; /* blue-600 */
      }

      /* === PRINT STYLING OPTIMIZED FOR THERMAL (58mm) === */
      @media print {
        /* 1. Atur Ukuran Kertas & Margin Nol */
        @page {
          size: 48mm auto; /* Lebar aman 48mm, Tinggi Auto (Cutter) */
          margin: 0mm;
        }

        /* 2. RESET TOTAL AGGRESIF (Membunuh Ghost Height / min-h-screen) */
        html, body, #root, div, span, applet, object, iframe,
        h1, h2, h3, h4, h5, h6, p, blockquote, pre,
        a, abbr, acronym, address, big, cite, code,
        del, dfn, em, img, ins, kbd, q, s, samp,
        small, strike, strong, sub, sup, tt, var,
        b, u, i, center, dl, dt, dd, ol, ul, li,
        fieldset, form, label, legend,
        table, caption, tbody, tfoot, thead, tr, th, td,
        article, aside, canvas, details, embed, 
        figure, figcaption, footer, header, hgroup, 
        menu, nav, output, ruby, section, summary,
        time, mark, audio, video {
            min-height: 0 !important; /* KUNCI: Matikan min-h-screen */
            height: auto !important;
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        /* 3. Atur Body Wrapper */
        html, body {
            width: 48mm !important;
            background-color: white !important;
            overflow: hidden !important; /* Sembunyikan scrollbar */
            position: static !important;
        }

        /* 4. Sembunyikan SEMUA elemen web */
        body * {
            visibility: hidden;
            height: 0 !important; /* Collapse space elemen tersembunyi */
            overflow: hidden !important;
        }

        /* 5. Tampilkan HANYA Container QR */
        #printable-qr, #printable-qr * {
            visibility: visible !important;
            height: auto !important; /* Kembalikan tinggi konten */
            overflow: visible !important;
        }

        /* 6. Positioning Container (Lepas dari layout parent) */
        #printable-qr {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 48mm !important; /* Paksa lebar sesuai kertas */
            
            /* Styling Konten */
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: flex-start !important;
            text-align: center !important;
            background-color: white !important;
            
            /* Padding Kertas */
            padding-bottom: 5mm !important; 
            margin: 0 !important;
            z-index: 999999 !important;
        }

        /* 7. Fix Gambar (Mencegah Gepeng) */
        #printable-qr img {
            width: 40mm !important; /* Max lebar gambar */
            height: auto !important; /* KUNCI: Jaga rasio aspek */
            display: block !important;
            margin: 2mm auto !important; /* Jarak atas bawah */
        }

        /* 8. Typography Kertas Kecil */
        #printable-qr h1 { 
            font-size: 10pt !important; 
            font-weight: 800 !important;
            margin-bottom: 2mm !important;
            text-transform: uppercase !important;
            display: block !important;
        }
        
        #printable-qr h2 { 
            font-size: 12pt !important; 
            font-weight: 900 !important;
            margin-top: 2mm !important;
            line-height: 1.1 !important;
            display: block !important;
        }
        
        #printable-qr p { 
            font-size: 9pt !important; 
            font-family: monospace !important;
            color: black !important;
            margin-top: 1mm !important;
            display: block !important;
        }

        /* Hilangkan elemen no-print secara eksplisit */
        .no-print {
            display: none !important;
        }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
