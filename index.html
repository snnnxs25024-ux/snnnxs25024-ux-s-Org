
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#2563eb" />

    <title>ABSENSI NEXUS SUNTER DC</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Custom Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; /* gray-100 */
      }
      ::-webkit-scrollbar-thumb {
        background: #3b82f6; /* blue-500 */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2563eb; /* blue-600 */
      }

      /* Print Styling for Thermal Printer - OPTIMIZED */
      @media print {
        @page {
          /* Atur ukuran kertas thermal standard (58mm). 
             'auto' pada height membuat printer memotong kertas setelah konten selesai. */
          size: 58mm auto; 
          margin: 0mm; 
        }
        
        html, body {
          width: 58mm; /* Paksa lebar body */
          background-color: white;
          margin: 0;
          padding: 0;
          /* Mencegah halaman kosong panjang akibat elemen tersembunyi */
          height: auto;
          overflow: hidden; 
        }

        /* Sembunyikan semua elemen default */
        body * {
          visibility: hidden;
        }

        /* Tampilkan container QR dan isinya */
        #printable-qr, #printable-qr * {
          visibility: visible;
        }

        /* Styling area print */
        #printable-qr {
          position: absolute; /* Lepas dari flow dokumen normal */
          left: 0;
          top: 0;
          width: 58mm; /* Lebar penuh kertas thermal */
          margin: 0;
          padding: 5px 0 20px 0; /* Padding bawah untuk space sobekan kertas */
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
          background-color: white;
          z-index: 9999;
          text-align: center;
        }

        /* Fix Gambar Gepeng: Paksa height auto agar rasio terjaga */
        #printable-qr img {
          width: 45mm !important; /* Lebar QR pas di kertas 58mm dengan margin */
          height: auto !important; /* KUNCI: Mencegah gambar gepeng */
          max-width: 100%;
          display: block;
          margin: 5px auto;
        }

        /* Sesuaikan ukuran font untuk kertas kecil */
        #printable-qr h1 {
          font-size: 9pt;
          font-weight: bold;
          margin-bottom: 5px;
          text-transform: uppercase;
        }
        
        #printable-qr h2 {
          font-size: 11pt;
          font-weight: 800;
          margin: 5px 0 2px 0;
          line-height: 1.2;
        }
        
        #printable-qr p {
          font-size: 8pt;
          margin: 0;
          color: black !important; /* Pastikan hitam pekat */
        }

        /* Hilangkan elemen no-print */
        .no-print {
          display: none !important;
        }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
